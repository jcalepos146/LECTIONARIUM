name: Publish site
# Builds the GitHub Pages site from main: the committed files, plus the share pages and cards
# (t/<id>/index.html, t/cards/<id>.jpg) that tools/build_traditions.py generates from data/traditions.json.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m playwright install --with-deps chromium
      - name: Select installed Chromium
        run: |
          python3 - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('PLAYWRIGHT_CHROMIUM=' + p.chromium.executable_path + '\n')
          PY
      - name: Stage the site
        run: |
          mkdir _site
          git ls-files -z | grep -zvE '^(tools|tests|\.github)/|^(package(-lock)?\.json|requirements-dev\.txt)$' | xargs -0 cp --parents -t _site
          touch _site/.nojekyll
          python3 tools/build_traditions.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
